 view.innerHTML=`<div class="atlas-heading"><span class="pill">Malý atlas / veľké súvislosti</span><h1>Celé slová.<br><em>Hneď vedľa seba.</em></h1><p class="muted">Porovnaj si tvary v pokoji. N, G, A a Abl; singulár a plurál v susedných stĺpcoch.</p></div><div class="panel"><div class="controls" style="margin-top:0"><label>Hľadať<input id="atlasSearch" type="search" placeholder="napr. corpus, kosť…"></label><label>Deklinácia<select id="declFilter"><option value="all">Všetky</option><option value="1">I. latinská</option><option value="g">I. grécka</option><option value="2">II. latinská a grécka</option><option value="3">III. spoluhlásková</option></select></label><label>Rod<select id="genderFilter"><option value="all">Všetky rody</option><option value="m">m · mužský</option><option value="f">f · ženský</option><option value="n">n · stredný</option></select></label><label class="toggle"><input type="checkbox" id="allWords">Zobraziť aj ostatné substantíva zo slovníka</label><button id="printAtlas">Vytlačiť atlas</button></div></div><div class="rules"><div class="rule mint"><h3>I. a II. deklinácia</h3><p>I. latinská: N SG -a, G SG -ae, rod f. I. grécka: raphe, raphes f.; diabetes, diabetae m.</p><p>II.: N SG -us/-er (spravidla m.), -um alebo grécke -on (n.), G SG -i. Výnimky: diameter a methodus sú f.; virus je n. (s. 21, 28–29).</p></div><div class="rule lavender"><h3>III. deklinácia: rodové pomôcky</h3><p>G SG -is. Pri spoluhláskovom type kniha uvádza: -or → m.; -do, -go, -io → f., ale tendo a margo → m.; -itas → f. (s. 36).</p><p>Zakončenie -us samo osebe rod neurčuje: corpus, crus, latus, pectus, pus, ulcus, vulnus sú tu n. (s. 37).</p></div><div class="rule peach"><h3>Výnimky sú súčasť učiva</h3><p>Os, ossis → G PL ossium. Vas, vasis: III. v SG, II. v PL (s. 38).</p><p>Zhoda je rovnaký rod, číslo a pád; koncovky môžu byť odlišné: pedis plani. Závislý genitív zostáva: glandulae linguae (s. 19, 38).</p></div></div><div class="notice source-scope">Úplne dodané sú strany 15–43. Atlas preto pokrýva I., II. a III. spoluhláskovú deklináciu a adjektíva I./II. deklinácie. III. i-deklináciu ani úplné IV./V. vzory nepridávam z iných zdrojov. „—“ znamená, že tvar tu nie je zahrnutý.</div><div id="atlasCards"></div><section class="panel"><div class="row between"><div><span class="pill">Adjektíva / porovnaj všetky tri rody</span><h2>Jedno adjektívum, tri podoby</h2></div><select id="adjChoice" aria-label="Adjektívum na porovnanie">${['latus','ruber','dexter','sinister','niger','lacer'].map(w=>`<option>${w}</option>`).join('')}</select></div><p class="muted small">Latinské tvary sú bez dĺžňov. Ruber, dexter a niger menia podobu kmeňa; sinister a lacer si -e- zachovávajú.</p><div class="atlas-grid" id="adjCards"></div></section><section class="panel"><h2>Celé spojenia: zhoda a väzba</h2><p class="muted">Porovnaj rozdielne deklinácie a zachovanie závislého genitívu.</p><div class="atlas-grid">${[

function results(){const h=state.history,total=h.reduce((a,r)=>a+r.total,0),right=h.reduce((a,r)=>a+r.right,0);view.innerHTML=`<span class="pill">Tvoj študijný denník</span><h1 class="page-title">Každý malý krok sa počíta.</h1><div class="stats"><div class="stat mint"><b>${h.length}</b>dokončených cvičení</div><div class="stat lavender"><b>${total?Math.round(right/total*100):0} %</b>„Vedela som“ · vlastné hodnotenie</div><div class="stat peach"><b>${state.review.length}</b>otázok na zopakovanie</div></div><div class="row" style="margin:20px 0"><button class="primary" id="reviewAll">↺ Zopakovať označené</button><button id="backup">Exportovať zálohu</button><button id="importBtn">Obnoviť zálohu</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"><button id="clearAll">Vymazať výsledky</button></div><p class="muted small">Zoznam na opakovanie sa aktualizuje po každom tvojom hodnotení. Záloha zahŕňa aj rozpracované cvičenie.</p>${storageNote()}<div class="panel"><h2>Posledné cvičenia</h2><p class="muted small">Uchováva sa posledných 100 cvičení v tomto prehliadači. Percentá sú založené výlučne na tvojom hodnotení.</p>${h.length?`<div style="overflow:auto"><table class="history"><thead><tr><th>Dátum</th><th>Režim</th><th>Vedela som</th><th></th></tr></thead><tbody>${h.map((r,i)=>`<tr><td>${new Date(r.date).toLocaleString('sk-SK')}</td><td>${{practice:'Tréning',homework:'Domáca úloha',exam:'Písomka'}[r.mode]}</td><td>${r.right} / ${r.total}</td><td><button data-report="${i}">Otvoriť →</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tvoje prvé dokončené cvičenie sa objaví tu. 🌱</div>'}</div>`;
 $('#reviewAll').onclick=repeat;$('#backup').onclick=()=>download('medlat-zaloha-v2.json',state);$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());validateBackup(data);if(!confirm('Nahradiť aktuálne výsledky a rozpracované cvičenie údajmi zo zálohy?'))return;clearInterval(timer);state=data;persist();results()}catch{alert('Túto zálohu sa nepodarilo načítať. Použi nezmenený export z MEDLAT v10.')}};

function validateBackup(d){if(!d||d.version!==2||!Array.isArray(d.history)||!Array.isArray(d.review)||!Array.isArray(d.mastered)||!d.prefs)throw Error();if(d.history.length>100||!d.review.every(x=>byId[x])||!d.mastered.every(x=>byId[x]))throw Error();for(const r of d.history){if(!Array.isArray(r.answers)||r.total!==r.answers.length||!r.answers.every(a=>byId[a.id]&&typeof a.value==='string'&&typeof a.rating==='boolean')||r.right!==r.answers.filter(a=>a.rating).length||!['practice','homework','exam'].includes(r.mode)||!Number.isFinite(r.seconds)||!Number.isFinite(Date.parse(r.date)))throw Error()}if(d.session){const s=d.session;if(!Array.isArray(s.ids)||!s.ids.length||!s.ids.every(id=>byId[id])||!Array.isArray(s.answers)||!['answer','review'].includes(s.phase)||!['practice','homework','exam'].includes(s.mode)||!Number.isInteger(s.index)||s.index<0||s.index>s.ids.length||typeof s.draft!=='string'||!Number.isFinite(s.deadline)||!Number.isFinite(s.started))throw Error();if(s.phase==='answer'&&s.index>=s.ids.length)throw Error();if(s.phase==='review'&&(!Number.isInteger(s.reviewIndex)||s.reviewIndex<0||s.reviewIndex>=s.answers.length))throw Error();if(!s.answers.every((a,i)=>a.id===s.ids[i]&&typeof a.value==='string'&&(a.rating===null||typeof a.rating==='boolean')))throw Error()}}
function download(name,data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function about(){view.innerHTML=`<div class="reading panel"><span class="pill">Učivo, ktorému vidíš pod povrch</span><h1 class="page-title">Z tvojej knihy. Pre tvoje učenie.</h1><p>MEDLAT v10 vychádza z tlačeného obsahu dodaných snímok IMG_4755–IMG_4783, plné strany 15–43. Ručné poznámky sa nepoužili. Lekcia 1 je úvod a stavba termínov, lekcia 2 I. latinská a grécka deklinácia, lekcia 3 II. latinská a grécka deklinácia a lekcia 4 III. spoluhlásková deklinácia.</p><div class="stats"><div class="stat mint"><b>${DATA.nouns.length+DATA.adjs.length}</b>slovníkových položiek</div><div class="stat lavender"><b>${DATA.terms.length}</b>termínov a spojení</div><div class="stat peach"><b>${bank.length}</b>zadaní vrátane oboch smerov</div></div><h2>Prečo majú kategórie odlišné počty?</h2><p>Genitív slov obsahuje 406 zadaní pre jednotlivé substantíva: osobitne G SG a tam, kde sa testuje, G PL. Genitív spojení používa menší súbor 58 viacslovných vzorov: 58 úloh v SG a 57 v PL, spolu 115. Ide o počty variantov otázok, nie o rovnaké zoznamy slov. Na kartách sa zobrazuje dostupný počet podľa lekcie, smeru prekladu a čísla / celkový počet v kategórii.</p><h2>Čo je prevzaté a čo je odvodené</h2><p>Slovníkové položky, spojenia, vzory a pravidlá pochádzajú z týchto strán. Preklady nevyriešených cvičení a ich nové tvary sú pripravené podľa slovnej zásoby a gramatiky knihy; nejde o vydavateľský kľúč. Pri otázkach je uvedená východisková strana. Grécke či latinské skloňovanie sa rozlišuje. Opakované výrazy vo viacerých lekciách sa môžu objaviť viackrát.</p><h2>Rozsah má jasné hranice</h2><p>Do atlasu sa nepridali celé III. i-kmeňové, IV. ani V. vzory: dodané sú iba útržky ich pokračovania. V úvodnej lekcii sa môžu vyskytnúť termíny z neskoršieho učiva; sú zaradené na preklad, nie na neprebrané skloňovanie. Singulár pri slovách uvedených len v pluráli sa netvorí. Pri diabetes, ascites, acne a pus sa v tejto verzii genitív plurálu netestuje. Virus má v atlase len singulár, ktorý dodané učivo podporuje.</p><h2>Ty rozhoduješ o správnosti</h2><p>Napíš odpoveď → odhaľ riešenie → „Vedela som“ alebo „Zopakovať“. Aplikácia nikdy nerozhoduje podľa presnej zhody textu. Uznaj si správne synonymum, slovosled aj odpoveď s preklepom podľa vlastného posúdenia. Latinské tvary sú bez dĺžňov, slovenské s diakritikou. Rovnaký zápis tak môže označovať viac pádov; otázka vždy určuje požadovaný pád a číslo.</p><h2>Skladanie termínov podľa vzoru</h2><p>Samostatná kategória podľa cvičení na s. 23, 31 a 39: tunica mucosa, fractura, fractura complicata, ruptura, musculus, spasmus, anomalia congenita, regio a contusio. Napíšeš celý výsledný názov. PL pri vstupných tvaroch je výslovne označený, aby sa napr. costae neplietlo s G SG. Pri musculus je výsledok podľa vytlačeného vzoru v PL: musculi palati.</p><h2>Genitív spojení: iba N → G</h2><p>Táto kategória obsahuje len tvorbu genitívu z nominatívu. Opačný smer G → N sa neprecvičuje ani v zmiešanom teste.</p><p>Pri zmene pádu sa mení hlavné podstatné meno a jeho zhodné adjektíva. Závislý genitív sa nemení automaticky. Pri tvorbe plurálu sa v tejto aplikácii mení číslo hlavného člena, kým číslo závislého genitívu zostáva zachované — rovnako ako v tabuľke glandula linguae na s. 19.</p><h2>Tréning, domáca úloha a písomka</h2><p>Tréning odhalí riešenie po každej otázke. Domáca úloha zbiera odpovede a odhalí ich až pri záverečnom sebahodnotení. Písomka má 15 minút na písanie odpovedí, bez riešení a atlasu v danom zobrazení. Po vypršaní času prejde do sebahodnotenia. Ide o študijnú simuláciu; nebráni otvoreniu inej aplikácie. Pri zatvorení súboru beží čas písomky ďalej.</p><h2>Ukladanie a súkromie</h2><p>Samostatný HTML súbor nevyžaduje účet ani internet a neodosiela odpovede na server. Pokrok sa priebežne ukladá do lokálneho úložiska tohto prehliadača, ak je povolené. Iný prehliadač, presunutý súbor či vymazané údaje môžu znamenať iné alebo prázdne úložisko. V časti Moje výsledky si môžeš vyexportovať a obnoviť JSON zálohu. Výsledky z index1.html sa nemiešajú s touto verziou.</p><p class="muted">Verzia index10.html · výhradne dodané strany učebnice · bez externých knižníc, fontov a sieťových požiadaviek.</p></div>`}

 }}catch{flashStorageOK=false}
function flashSave(){try{localStorage.setItem(FLASHKEY,JSON.stringify(flashState));flashStorageOK=true}catch{flashStorageOK=false}}
function flashPool(){const p=flashState.prefs;return FLASHCARDS.filter(c=>(p.lesson==='all'||c.lesson===+p.lesson)&&(p.group==='all'||c.group===p.group))}
function flashStatus(pool){return {known:pool.filter(c=>flashState.ratings[c.id]==='known').length,again:pool.filter(c=>flashState.ratings[c.id]==='again').length}}
function flashHome(){page='flashcards';setNav('flashcards');const p=flashState.prefs;
 view.innerHTML=`<div class="fc-heading row between"><div><span class="pill">Otoč. Spoj si súvislosti. Zapamätaj si.</span><h1>Slovná zásoba <em>KARTIČKY</em></h1><p>Kartičky oboma smermi. Celý význam, slovníkový tvar a vzor po otočení.</p></div><button id="fcBackHome">← Precvičovanie</button></div>
 <div class="fc-setup panel"><div class="controls" style="margin-top:0"><label>Lekcia<select id="fcLesson"><option value="all">Všetky slovníky · lekcie 2–4</option>${[2,3,4].map(n=>`<option value="${n}" ${p.lesson==n?'selected':''}>${lessons[n]}</option>`).join('')}</select></label><label>Smer učenia<select id="fcDirection"><option value="la-sk" ${p.direction==='la-sk'?'selected':''}>LAT → SK</option><option value="sk-la" ${p.direction==='sk-la'?'selected':''}>SK → LAT</option></select></label><label>Poradie<select id="fcOrder"><option value="book" ${p.order==='book'?'selected':''}>Podľa slovnej zásoby v knihe</option><option value="random" ${p.order==='random'?'selected':''}>Premiešané</option></select></label></div>
 <div class="fc-group-grid">${Object.entries(flashGroups).map(([id,name])=>`<button class="fc-group ${p.group===id?'selected':''}" data-flash-group="${id}" aria-pressed="${p.group===id}">${name}<span data-flash-count="${id}"></span></button>`).join('')}</div>
 <p class="muted small">Substantíva a adjektíva sú samostatné heslá. Ostatné = predložky, spojka <em>et</em> a viacslovné heslá uvedené v slovnej zásobe. V smere LAT → SK vidíš vpredu iba prvý tvar, napr. <em>albus</em>, bez nápovedy. V smere SK → LAT začínaš slovenským významom.</p>
 <div class="fc-pool-info" id="fcPoolInfo" aria-live="polite"></div><div class="row"><button id="fcStart" class="primary large">Otvoriť kartičky →</button><button id="fcRepeat">↺ Iba označené na opakovanie</button></div><p class="muted small" style="margin-top:15px;margin-bottom:0">Latinské tvary sú bez dĺžňov. Po otočení vidíš celý genitív a rod skratkou m. / f. / n.; pod tým menším písmom deklináciu a vzor. Slovenské významy zachovávajú aj číslovanie a zátvorky z knihy.</p></div>
 ${flashState.session?`<div class="resume row between"><div><strong>Rozpracované kartičky</strong><div class="muted">${flashState.session.index+1} / ${flashState.session.ids.length}</div></div><button id="fcResume" class="primary">Pokračovať →</button></div>`:''}
 <div class="fc-coverage panel"><div class="row between"><div><span class="pill">Prehľad obsahu</span><h2>Vieš presne, čo sa učíš.</h2></div><button id="fcShowList" aria-expanded="false">Zobraziť zoznam hesiel</button></div><p class="muted small">Slovná zásoba: s. 24–26, 32–34 a 41–42. Lekcia 1 na dodaných stranách samostatný slovník nemá. Viacslovné podheslá sú zahrnuté; dve heslá <em>os</em> sú na jednej kartičke s oboma riešeniami. Heslo diabetes sa nachádza v slovníkoch 2. aj 3. lekcie.</p><div id="fcWordList" class="hidden"></div></div><div id="fcStorage"></div>`;
 function sync(){p.lesson=$('#fcLesson').value;p.order=$('#fcOrder').value;p.direction=$('#fcDirection').value;flashSave();for(const id of Object.keys(flashGroups)){const count=FLASHCARDS.filter(c=>(p.lesson==='all'||c.lesson===+p.lesson)&&(id==='all'||c.group===id)).length;const el=view.querySelector(`[data-flash-count="${id}"]`);if(el)el.textContent=count+' kartičiek'}view.querySelectorAll('[data-flash-group]').forEach(b=>{b.classList.toggle('selected',b.dataset.flashGroup===p.group);b.setAttribute('aria-pressed',b.dataset.flashGroup===p.group)});const pool=flashPool(),st=flashStatus(pool);$('#fcPoolInfo').innerHTML=`<strong>${pool.length} kartičiek v tomto výbere</strong><span>${st.known} viem · ${st.again} na opakovanie · ${pool.length-st.known-st.again} zatiaľ neoznačených</span>`;$('#fcStart').disabled=!pool.length;$('#fcRepeat').disabled=!st.again;$('#fcStorage').innerHTML=flashStorageOK?'':'<div class="notice">Ukladanie kartičiek nie je dostupné. Pokrok zostane iba počas otvorenia stránky.</div>';if(!$('#fcWordList').classList.contains('hidden'))renderFlashList()}
 $('#fcLesson').onchange=sync;$('#fcOrder').onchange=sync;$('#fcDirection').onchange=sync;view.querySelectorAll('[data-flash-group]').forEach(b=>b.onclick=()=>{p.group=b.dataset.flashGroup;sync()});$('#fcStart').onclick=()=>flashStart(flashPool());$('#fcRepeat').onclick=()=>flashStart(flashPool().filter(c=>flashState.ratings[c.id]==='again'));$('#fcBackHome').onclick=()=>go('home');if($('#fcResume'))$('#fcResume').onclick=renderFlashStudy;
 $('#fcShowList').onclick=()=>{const show=$('#fcWordList').classList.contains('hidden');$('#fcWordList').classList.toggle('hidden',!show);$('#fcShowList').setAttribute('aria-expanded',show);$('#fcShowList').textContent=show?'Skryť zoznam hesiel':'Zobraziť zoznam hesiel';if(show)renderFlashList()};sync();
}
function renderFlashList(){const rows=flashPool().slice().sort((a,b)=>a.lesson-b.lesson||a.page-b.page||a.front.localeCompare(b.front,'la'));$('#fcWordList').innerHTML=`<div class="fc-list-scroll"><table class="history"><thead><tr><th>Latinsky</th><th>Skupina</th><th>Zdroj</th></tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c.front)}</td><td>${flashGroups[c.group]}</td><td>Lekcia ${c.lesson} · s. ${c.page}</td></tr>`).join('')}</tbody></table></div>`}
function flashStart(pool){if(!pool.length)return;if(flashState.session&&!confirm('Začať nový balíček a nahradiť rozpracované kartičky? Označené slová zostanú uložené.'))return;
 const ordered=flashState.prefs.order==='random'?shuffle(pool):pool.slice().sort((a,b)=>a.lesson-b.lesson||a.page-b.page||a.front.localeCompare(b.front,'la'));
 flashState.session={ids:ordered.map(c=>c.id),index:0,flipped:false,answers:{},direction:flashState.prefs.direction};flashSave();renderFlashStudy();window.scrollTo(0,0)
}
function flashDirection(){return flashState.session?.direction||flashState.prefs.direction||'la-sk'}
function flashFront(c){const reverse=flashDirection()==='sk-la';return `<span class="fc-side-label">${reverse?'SLOVENSKY':'LATINSKY'}</span>${reverse?`<span class="fc-senses">${c.senses.map(s=>`<span class="fc-sense"><span class="fc-meaning">${esc(s.meaning)}</span></span>`).join('')}</span>`:`<span class="fc-latin">${esc(c.front)}</span>`}<span class="fc-turn-hint">Klikni a otoč kartičku <span aria-hidden="true">↻</span></span>`}
function flashBack(c){const reverse=flashDirection()==='sk-la';return `<span class="fc-side-label">${reverse?'LATINSKY · SLOVNÍKOVÝ TVAR':'PREKLAD A SLOVNÍKOVÝ TVAR'}</span><span class="fc-senses">${c.senses.map(s=>`<span class="fc-sense">${reverse?'':`<span class="fc-meaning">${esc(s.meaning)}</span>`}<span class="fc-dictionary ${reverse?'fc-latin-answer':''}">${esc(s.dictionary)}</span><span class="fc-morphology">${esc(s.morphology)}</span></span>`).join('')}</span><span class="fc-turn-hint">Lekcia ${c.lesson} · s. ${c.page} · kliknutím späť na ${reverse?'slovenčinu':'latinčinu'}</span>`}

function renderFlashStudy(){const s=flashState.session;if(!s)return flashHome();page='flashStudy';setNav('flashcards');const c=flashById[s.ids[s.index]],rating=s.answers[c.id];view.innerHTML=`<div class="fc-study"><div class="row between"><div><span class="pill">Slovná zásoba KARTIČKY · ${s.direction==='sk-la'?'SK → LAT':'LAT → SK'}</span><h2 class="fc-deck-title">${s.index+1} <span>/ ${s.ids.length}</span></h2></div><button id="fcClose">Uložiť a zavrieť</button></div><div class="progress fc-progress"><div style="width:${Object.keys(s.answers).length/s.ids.length*100}%"></div></div><div class="fc-position-note">${Object.keys(s.answers).length} označených v tomto balíčku${rating?' · táto kartička: '+(rating==='known'?'viem':'zopakovať'):''}</div>
 <button id="fcTurn" class="fc-card ${s.flipped?'fc-back':'fc-front'}" aria-label="${s.flipped?'Otočiť na zadanie':s.direction==='sk-la'?'Odhaliť latinský slovníkový tvar':'Odhaliť preklad a slovníkový tvar'}">${s.flipped?flashBack(c):flashFront(c)}</button><div class="fc-judge" id="fcJudge">${s.flipped?'<button class="judge yes" id="fcKnow">✓ Viem</button><button class="judge no" id="fcAgain">↺ Zopakovať</button>':`<p>${s.direction==='sk-la'?'Vybav si latinské slovo, genitív a rod. Potom kartičku otoč.':'Najprv si vybav preklad, genitív aj rod. Potom kartičku otoč.'}</p>`}</div>
 <div class="row between fc-movement"><button id="fcPrev" ${s.index===0?'disabled':''}>← Predchádzajúca</button><span class="muted small">Medzerník: otočiť · šípky: listovať</span><button id="fcNext">${s.index===s.ids.length-1?'Dokončiť balíček':'Ďalšia →'}</button></div></div>`;
 $('#fcTurn').onclick=flashTurn;$('#fcClose').onclick=()=>{flashSave();go('flashcards')};$('#fcPrev').onclick=()=>flashMove(-1);$('#fcNext').onclick=()=>flashMove(1);if(s.flipped){$('#fcKnow').onclick=()=>flashRate('known',c.id);$('#fcAgain').onclick=()=>flashRate('again',c.id)}
}
function flashTurn(){const s=flashState.session;if(!s||page!=='flashStudy')return;s.flipped=!s.flipped;flashSave();renderFlashStudy();$('#fcTurn').focus()}
function flashMove(delta){const s=flashState.session;if(!s||page!=='flashStudy')return;if(s.index+delta<0)return;if(s.index+delta>=s.ids.length){flashFinish();return}s.index+=delta;s.flipped=false;flashSave();renderFlashStudy()}
function flashRate(rating,expectedId){const s=flashState.session;if(!s||!s.flipped||s.ids[s.index]!==expectedId||!['known','again'].includes(rating))return;s.answers[expectedId]=rating;flashState.ratings[expectedId]=rating;flashSave();flashMove(1)}
function flashFinish(){const s=flashState.session;if(!s)return;const ids=s.ids.slice(),known=Object.values(s.answers).filter(x=>x==='known').length,again=Object.values(s.answers).filter(x=>x==='again').length;flashState.session=null;flashSave();page='flashResult';view.innerHTML=`<div class="quiz"><div class="panel fc-summary"><span class="pill">Balíček dokončený</span><h1>O kúsok bližšie<br>k istej odpovedi.</h1><div class="stats"><div class="stat mint"><b>${known}</b>viem</div><div class="stat peach"><b>${again}</b>zopakovať</div><div class="stat lavender"><b>${ids.length-known-again}</b>bez hodnotenia</div></div><div class="row" style="margin-top:24px"><button id="fcRepeatDeck" class="primary" ${again?'':'disabled'}>↺ Zopakovať neisté</button><button id="fcRestartDeck">Celý balíček znova</button><button id="fcChoose">Vybrať iné kartičky</button></div></div></div>`;$('#fcRepeatDeck').onclick=()=>{flashState.prefs.direction=s.direction||'la-sk';flashStart(ids.filter(id=>s.answers[id]==='again').map(id=>flashById[id]))};$('#fcRestartDeck').onclick=()=>{flashState.prefs.direction=s.direction||'la-sk';flashStart(ids.map(id=>flashById[id]))};$('#fcChoose').onclick=()=>go('flashcards');window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(page!=='flashStudy'||e.repeat||e.ctrlKey||e.altKey||e.metaKey)return;const tag=e.target?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag)||e.target?.isContentEditable)return;if((e.code==='Space'||e.key===' ')&&(!tag||tag==='BODY'||e.target?.id==='fcTurn')){e.preventDefault();flashTurn()}else if(e.key==='ArrowLeft'){e.preventDefault();flashMove(-1)}else if(e.key==='ArrowRight'){e.preventDefault();flashMove(1)}});

home();
</script></body></html>
